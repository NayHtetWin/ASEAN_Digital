sources:
  - name: "Grants.gov"
    url: "https://api.grants.gov/v1/api/search2"
    frequency: "daily"
    type: "grants_gov"
    statuses: "forecasted|posted"
    keywords:
      - "ASEAN"
      - "\"Southeast Asia\""
      - "Indo-Pacific"
      - "Mekong"
      - "Indonesia"
      - "Vietnam"
      - "Philippines"
      - "Thailand"
      - "Malaysia"
      - "Cambodia"
      - "Laos"
      - "Myanmar"
      - "Timor-Leste"

  - name: "EU Funding & Tenders Portal"
    url: "https://api.tech.ec.europa.eu/search-api/prod/rest/search"
    frequency: "daily"
    type: "eu_portal"
    keywords:
      - "ASEAN"
      - "Southeast Asia"
      - "Indo-Pacific"
      - "Indonesia"
      - "Vietnam"
      - "Viet Nam"
      - "Philippines"
      - "Thailand"
      - "Malaysia"
      - "Cambodia"
      - "Laos"
      - "Myanmar"
      - "Timor-Leste"

  - name: "World Bank Procurement Notices"
    url: "https://search.worldbank.org/api/v2/procnotices"
    frequency: "daily"
    type: "worldbank"
    keywords:
      - "digital"
      - "ICT"
      - "artificial intelligence"
      - "e-government"
      - "broadband"
      - "data center"
      - "cybersecurity"
      - "information system"
      - "digital skills"

  - name: "FundsforNGOs"
    url: "https://www2.fundsforngos.org/feed/"
    frequency: "daily"
    type: "rss"

  - name: "FundsforNGOs Companies (ASEAN)"
    url: "https://fundsforcompanies.fundsforngos.org/?s=ASEAN&feed=rss2"
    frequency: "daily"
    type: "rss"

  - name: "The Asia Foundation"
    url: "https://asiafoundation.org/feed/"
    frequency: "weekly"
    type: "rss"

  - name: "Opportunity Desk"
    url: "https://www.opportunitydesk.org/feed/"
    frequency: "daily"
    type: "rss"

  - name: "DT Global Procurements"
    url: "https://dt-global.com/procurements/"
    frequency: "daily"
    type: "html"
    item_selector: "li.pdf-downloads__item"
    link_selector: "a.pdf-downloads__button"
    title_selector: "h4.pdf-downloads__item-title"
    deadline_selector: ".pdf-downloads__meta-item--date .pdf-downloads__meta-text"

  - name: "ReliefWeb"
    url: "https://reliefweb.int/updates/rss.xml"
    frequency: "daily"
    type: "rss"

  - name: "UNDP Procurement Notices"
    url: "https://procurement-notices.undp.org/"
    frequency: "daily"
    type: "html"
    item_selector: "a.vacanciesTableLink.region_RAS"
    link_selector: "a"
    title_selector: "div.vacanciesTable__cell:nth-of-type(1) span"
    deadline_selector: "div.vacanciesTable__cell:nth-of-type(5) span"

  - name: "ASEAN Secretariat"
    url: "https://asean.org/feed/"
    frequency: "weekly"
    type: "rss"
    force_region: "ASEAN"

  - name: "ASEAN STI Network (ASTNET)"
    url: "https://astnet.asean.org/feed/"
    frequency: "weekly"
    type: "rss"
    force_region: "ASEAN"

  - name: "ASEAN Foundation"
    url: "https://aseanfoundation.org/call-for-applications/"
    frequency: "weekly"
    type: "html"
    item_selector: "h4"
    link_selector: "a"
    context_parent_levels: 2
    skip_if_text: "Registration Closed"
    force_region: "ASEAN"

  - name: "Google News – ASEAN Digital CFP"
    url: "https://news.google.com/rss/search?q=%22call+for+proposals%22+ASEAN+digital&hl=en-SG&gl=SG&ceid=SG:en"
    frequency: "daily"
    type: "rss"

  - name: "Google News – ASEAN AI Grants"
    url: "https://news.google.com/rss/search?q=ASEAN+AI+grant+applications+open&hl=en-SG&gl=SG&ceid=SG:en"
    frequency: "daily"
    type: "rss"

  - name: "Google News – SEA Digital Transformation Tenders"
    url: "https://news.google.com/rss/search?q=tender+%22digital+transformation%22+Indonesia+OR+Vietnam+OR+Philippines&hl=en-SG&gl=SG&ceid=SG:en"
    frequency: "daily"
    type: "rss"

  - name: "Google News – ASEAN Future of Work"
    url: "https://news.google.com/rss/search?q=%22future+of+work%22+ASEAN+fund+OR+grant&hl=en-SG&gl=SG&ceid=SG:en"
    frequency: "daily"
    type: "rss"

